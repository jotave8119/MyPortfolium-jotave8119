<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="orb" cx="78%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ff8e72" stop-opacity="0.9"/>
      <stop offset="42%" stop-color="#e2543b" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#c8442f" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0e0c0a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0e0c0a"/>
  <circle cx="930" cy="270" r="360" fill="url(#orb)"/>

  <!-- eyebrow -->
