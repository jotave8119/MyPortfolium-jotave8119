  </text>

  <!-- name (display serif) -->
  <text x="76" y="290" fill="#f3ece1"
        font-family="'Instrument Serif',Georgia,'Times New Roman',serif" font-size="120">João Vitor</text>
  <text x="76" y="410" fill="#f3ece1"
